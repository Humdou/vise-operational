<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6678"/>
      <stop offset="0.55" stop-color="#e0344a"/>
      <stop offset="1" stop-color="#8f1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#e0344a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0344a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- fond noir profond arrondi -->
  <rect width="64" height="64" rx="13" fill="#0a0a0c"/>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#2b2d33" stroke-width="1.5"/>
  <circle cx="32" cy="33" r="26" fill="url(#glow)"/>
  <!-- viseur : anneau + 4 crans -->
  <circle cx="32" cy="33" r="21" fill="none" stroke="#5a1018" stroke-width="3"/>
  <g stroke="#e0344a" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="6"  x2="32" y2="13"/>
    <line x1="32" y1="53" x2="32" y2="60"/>
    <line x1="5"  y1="33" x2="12" y2="33"/>
    <line x1="52" y1="33" x2="59" y2="33"/>
  </g>
  <!-- triangle rouge premium -->
  <path d="M 32 18 L 46 44 L 18 44 Z" fill="url(#tri)"/>
  <path d="M 32 18 L 46 44 L 18 44 Z" fill="none" stroke="#ff8a98" stroke-width="1.4" opacity="0.8"/>
  <!-- arête lumineuse -->
  <path d="M 32 18 L 25 31 L 32 27 Z" fill="#ffaab4" opacity="0.55"/>
</svg>
